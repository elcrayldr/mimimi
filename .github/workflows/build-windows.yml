name: CRAY LDR Urban Instruments - Windows Build

on:
  push:
    branches: [ main, develop, "fix/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JUCE_VERSION: "8.0.6"
  CMAKE_BUILD_TYPE: Release

jobs:
  build-windows:
    name: Build VST3 (Windows x64)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        id: cache-juce
        with:
          path: ${{ github.workspace }}/juce-src
          key: juce-${{ env.JUCE_VERSION }}-windows

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:JUCE_VERSION https://github.com/juce-framework/JUCE.git "$env:GITHUB_WORKSPACE/juce-src"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake -S . -B build -DJUCE_DIR="$env:GITHUB_WORKSPACE/juce-src" -DCRAY_BUILD_TESTS=OFF -DCRAY_BUILD_STANDALONE=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Locate VST3
        id: locate
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if ($null -eq $plugin) { throw "VST3 artifact was not produced." }
          "VST3_PATH=$($plugin.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: CRAY-LDR-Urban-Instruments-VST3-Win64
          path: ${{ steps.locate.outputs.VST3_PATH }}
          if-no-files-found: error
          retention-days: 30
