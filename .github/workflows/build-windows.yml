name: CRAY LDR Urban Instruments - Windows Build

on:
  push:
    branches: [ main, develop, 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Keep only the newest build for each branch / pull-request ref.
concurrency:
  group: cray-ldr-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_VERSION: "8.0.6"
  CMAKE_BUILD_TYPE: Release

jobs:
  build-windows:
    name: Build VST3 (Windows x64)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        id: cache-juce
        with:
          path: ${{ github.workspace }}/juce-src
          key: juce-${{ env.JUCE_VERSION }}-windows

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:JUCE_VERSION https://github.com/juce-framework/JUCE.git "$env:GITHUB_WORKSPACE/juce-src"

      - name: Validate release packaging script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE/package_release.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "Release packaging script contains PowerShell syntax errors."
          }
          Write-Host "PowerShell release packaging script syntax is valid."

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_DIR="$env:GITHUB_WORKSPACE/juce-src" -DCRAY_BUILD_TESTS=ON -DCRAY_BUILD_STANDALONE=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Locate VST3
        id: locate
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if ($null -eq $plugin) { throw "VST3 artifact was not produced." }
          $presetDir = Join-Path $plugin.FullName "Contents\Resources\FactoryPresets"
          $presets = @(Get-ChildItem -Path $presetDir -File -Filter "*.craypreset" -ErrorAction SilentlyContinue)
          if ($presets.Count -lt 8) {
            throw "Expected at least 8 factory presets in $presetDir, found $($presets.Count)."
          }
          Write-Host "Verified $($presets.Count) factory presets in the VST3 bundle."
          python scripts/validate_factory_presets.py "$presetDir"
          if ($LASTEXITCODE -ne 0) { throw "Factory preset manifest validation failed." }
          python scripts/validate_vst3_bundle.py "$($plugin.FullName)"
          if ($LASTEXITCODE -ne 0) { throw "VST3 bundle architecture validation failed." }
          "VST3_PATH=$($plugin.FullName)" >> $env:GITHUB_OUTPUT

      - name: Prepare final Windows release package
        id: package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "CRAY-LDR-Urban-Instruments-Release"
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          $vst3Stage = Join-Path $stage "VST3"
          $standaloneStage = Join-Path $stage "Standalone"
          New-Item -ItemType Directory -Path $vst3Stage -Force | Out-Null
          New-Item -ItemType Directory -Path $standaloneStage -Force | Out-Null

          $pluginPath = "${{ steps.locate.outputs.VST3_PATH }}"
          Copy-Item -LiteralPath $pluginPath -Destination $vst3Stage -Recurse

          $standalone = Get-ChildItem -Path build -Recurse -File -Filter "*.exe" |
            Where-Object { $_.Name -like "*CRAY*" -or $_.Name -like "*Urban*" } |
            Select-Object -First 1
          if ($null -eq $standalone) { throw "Standalone executable was not produced." }
          Copy-Item -LiteralPath $standalone.FullName -Destination $standaloneStage

          foreach ($doc in @("README.md", "ARCHITECTURE.md")) {
            if (Test-Path -LiteralPath $doc) { Copy-Item -LiteralPath $doc -Destination $stage }
          }
          @"
          CRAY LDR URBAN INSTRUMENTS
          Version: 1.0.2
          Platform: Windows x64
          JUCE: 8.0.6
          Build: Release
          Automated unit tests: passed
          "@" | Set-Content -LiteralPath (Join-Path $stage "VERSION.txt") -Encoding UTF8

          $zip = Join-Path $env:RUNNER_TEMP "CRAY-LDR-Urban-Instruments-Win64-Release.zip"
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $zip)) { throw "Release ZIP was not created." }
          "RELEASE_ZIP=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload final Windows release package
        uses: actions/upload-artifact@v4
        with:
          name: CRAY-LDR-Urban-Instruments-Win64-Release
          path: ${{ steps.package.outputs.RELEASE_ZIP }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: CRAY-LDR-Urban-Instruments-VST3-Win64
          path: ${{ steps.locate.outputs.VST3_PATH }}
          if-no-files-found: error
          retention-days: 30
