name: CRAY LDR Urban Instruments — Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JUCE_VERSION: "8.0.6"
  CMAKE_BUILD_TYPE: Release

jobs:
  build-windows:
    name: Build VST3 (Windows x64)
    runs-on: windows-2022

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------ #
      # 2. Cache JUCE to avoid re-fetching on every run
      # ------------------------------------------------------------------ #
      - name: Cache JUCE 8.0.6
        uses: actions/cache@v4
        id: cache-juce
        with:
          path: ${{ github.workspace }}/juce-src
          key: juce-${{ env.JUCE_VERSION }}-windows

      - name: Clone JUCE (if not cached)
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.JUCE_VERSION }} `
            https://github.com/juce-framework/JUCE.git `
            "${{ github.workspace }}/juce-src"

      # ------------------------------------------------------------------ #
      # 3. Configure CMake
      # ------------------------------------------------------------------ #
      - name: Configure CMake
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} `
            -DJUCE_DIR="${{ github.workspace }}/juce-src" `
            -DCRAY_BUILD_TESTS=ON `
            -DCRAY_BUILD_STANDALONE=ON

      # ------------------------------------------------------------------ #
      # 4. Build Release
      # ------------------------------------------------------------------ #
      - name: Build
        run: |
          cmake --build build --config Release --parallel

      # ------------------------------------------------------------------ #
      # 5. Run Unit Tests
      # ------------------------------------------------------------------ #
      - name: Run CTest
        working-directory: build
        run: |
          ctest -C Release --output-on-failure --timeout 120

      # ------------------------------------------------------------------ #
      # 6. Upload VST3 artifact
      # ------------------------------------------------------------------ #
      - name: Locate VST3
        id: find-vst3
        run: |
          $vst3 = Get-ChildItem -Recurse -Filter "*.vst3" build/ | Select-Object -First 1
          echo "VST3_PATH=$($vst3.FullName)" >> $env:GITHUB_OUTPUT
          echo "VST3_DIR=$($vst3.DirectoryName)" >> $env:GITHUB_OUTPUT

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: CRAY-LDR-Urban-Instruments-VST3-Win64
          path: ${{ steps.find-vst3.outputs.VST3_DIR }}
          retention-days: 30

      # ------------------------------------------------------------------ #
      # 7. Upload Resources alongside VST3
      # ------------------------------------------------------------------ #
      - name: Upload Resources
        uses: actions/upload-artifact@v4
        with:
          name: CRAY-LDR-Urban-Instruments-Resources
          path: Resources/
          retention-days: 30

  # ----------------------------------------------------------------------- #
  # Optional: Create a Draft GitHub Release on tags
  # ----------------------------------------------------------------------- #
  release-draft:
    name: Draft Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download VST3 artifact
        uses: actions/download-artifact@v4
        with:
          name: CRAY-LDR-Urban-Instruments-VST3-Win64
          path: release/vst3

      - name: Download Resources artifact
        uses: actions/download-artifact@v4
        with:
          name: CRAY-LDR-Urban-Instruments-Resources
          path: release/Resources

      - name: Create release ZIP
        run: |
          cd release
          zip -r ../CRAY_LDR_Urban_Instruments_${{ github.ref_name }}_Win64.zip .

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          files: "CRAY_LDR_Urban_Instruments_${{ github.ref_name }}_Win64.zip"
          body: |
            ## CRAY LDR URBAN INSTRUMENTS ${{ github.ref_name }}
            
            ### Contents
            - `CRAY LDR URBAN INSTRUMENTS.vst3` (Windows x64)
            - Factory Presets (8 categories)
            - Factory Samples directory
            
            ### Installation
            Copy `CRAY LDR URBAN INSTRUMENTS.vst3` to:
            ```
            C:\Program Files\Common Files\VST3\
            ```
            
            See `README.md` for full installation and build instructions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
